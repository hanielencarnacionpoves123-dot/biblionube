# Uso: cp .env.example .env  ->  editar .env  ->  docker compose up -d --build
services:
  web:
    build: .
    image: biblionube
    container_name: biblionube
    ports:
      - "80:80"
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME:-biblioteca}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    restart: unless-stopped
